paths:
  /books:
    get:
      summary: List books
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/schemas/Book'
                required:
                  - items
schemas:
  Book:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime
      user_id:
        type: string